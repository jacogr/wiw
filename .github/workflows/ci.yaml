name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install OS deps (make + m4)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make m4

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Check JavaScript types
        run: make check-js

      - name: Install WABT (pinned wat2wasm)
        run: |
          set -eux
          WABT_VER=1.0.42
          WABT_SHA256=84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131
          curl -fL -o wabt.tar.gz \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VER}/wabt-${WABT_VER}-linux-x64.tar.gz"
          echo "$WABT_SHA256  wabt.tar.gz" | sha256sum --check
          tar -xzf wabt.tar.gz

          WABT_BIN_DIR="$PWD/wabt-${WABT_VER}/bin"
          export PATH="$WABT_BIN_DIR:$PATH"
          echo "$WABT_BIN_DIR" >> "$GITHUB_PATH"

          command -v wat2wasm
          wat2wasm --version
          test "$(wat2wasm --version)" = "$WABT_VER"

      - name: Install Binaryen (pinned wasm-opt)
        run: |
          set -eux
          BIN_VER=133
          BIN_SHA256=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
          curl -fL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BIN_VER}/binaryen-version_${BIN_VER}-x86_64-linux.tar.gz"
          echo "$BIN_SHA256  binaryen.tar.gz" | sha256sum --check
          tar -xzf binaryen.tar.gz

          BIN_DIR="$PWD/binaryen-version_${BIN_VER}/bin"

          # Use it immediately in this step:
          export PATH="$BIN_DIR:$PATH"

          # And persist for subsequent steps:
          echo "$BIN_DIR" >> "$GITHUB_PATH"

          command -v wasm-opt
          wasm-opt --version
          # Release archives include the tag suffix; packaged builds may omit it.
          BIN_VERSION_OUTPUT="$(wasm-opt --version)"
          case "$BIN_VERSION_OUTPUT" in
            "wasm-opt version $BIN_VER"|"wasm-opt version $BIN_VER (version_$BIN_VER)") ;;
            *) echo "Unexpected Binaryen version: $BIN_VERSION_OUTPUT" >&2; exit 1 ;;
          esac

      - name: Inspect Binaryen optimization pass order
        run: make inspect-opt

      - name: Run self-hosted tests and full spec on the optimized bootstrap
        run: |
          make check-wat

      - name: Run tests and full spec on the native optimized bootstrap
        run: make check-wasm
