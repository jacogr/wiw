<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wiw — WAT interpreter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 960px;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      p {
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 1.5rem 0 0.5rem;
        font-weight: 600;
      }
      textarea,
      pre {
        box-sizing: border-box;
        width: 100%;
        padding: 1rem;
        border: 1px solid #8888;
        border-radius: 0.4rem;
        font: 0.95rem/1.5 ui-monospace, monospace;
      }
      textarea {
        min-height: 20rem;
        resize: vertical;
        tab-size: 2;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.6rem 1.5rem;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
      }
      pre {
        min-height: 6rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>wiw</h1>
    <p>
      Paste WAT and run it. Module initialization runs first, then each function export with no arguments.
    </p>
    <label for="wat">WAT input</label>
    <textarea id="wat" spellcheck="false" aria-describedby="hint">
(module
  (func (export "answer") (result i32)
    i32.const 42))</textarea
    >
    <p id="hint">Functions requiring arguments are listed without being called.</p>
    <button id="run" type="button">Run</button>
    <label id="output-label">Output</label>
    <pre id="output" aria-labelledby="output-label" aria-live="polite">Ready.</pre>
    <script type="module" src="./wiw-browser.js"></script>
  </body>
</html>
